name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job; the security job raises its own scope below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: lint -> build (tsc -b) -> test, via the shared reusable workflow.
  frontend:
    uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
    with:
      working-directory: frontend

  # Backend: real gating (ruff + mypy + pytest). The shared python-ci workflow
  # swallows failures with `|| true`, so we run an inline job that actually
  # fails the build on lint/type/test errors.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest tests/ -q

      # Every migration must apply from scratch, and the migrated schema must
      # match the ORM models, before anything reaches the production database.
      - name: Alembic upgrade on a scratch database
        env:
          ORBIT_DATABASE_URL: sqlite:///./ci_migration_check.db
        run: uv run alembic upgrade head

      - name: Alembic check on the migrated database
        env:
          ORBIT_DATABASE_URL: sqlite:///./ci_migration_check.db
        run: uv run alembic check

  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write

  # Applies pending migrations to Neon once every check on main has passed.
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend, security]
    uses: ./.github/workflows/migrate.yml
    permissions:
      contents: read
    secrets:
      ORBIT_DATABASE_URL: ${{ secrets.ORBIT_DATABASE_URL }}
