[project]
name = "orbit"
version = "0.1.0"
description = "Personal CRM backend -- contacts, connections, and interaction tracking"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Sagar Gupta" }]
dependencies = [
    "fastapi>=0.129.2",
    "uvicorn[standard]>=0.41.0",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.3",
    "httpx>=0.28.1",
    "ruff>=0.15.4",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["orbit"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
